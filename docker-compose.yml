services:

  # ORACLE
  oracle-db:
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle-db
    ports:
      - "1522:1521"
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: scott
      APP_USER_PASSWORD: tiger
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2048M
    networks:
      - microservices-net

  # RABBITMQ
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - microservices-net

  # CONFIG SERVER
  config-server:
    build: ./config-server
    container_name: config-server
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - microservices-net

  # EUREKA SERVER
  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    depends_on:
      config-server:
        condition: service_healthy
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - microservices-net

  # API GATEWAY
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "7070:8080"
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - microservices-net

  # AUTH SERVICE
  authentication-service:
    build: ./authentication-service
    container_name: authentication-service
    ports:
      - "7071:7071"
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      oracle-db:
        condition: service_healthy
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@//oracle-db:1521/XEPDB1
      - SPRING_DATASOURCE_USERNAME=scott
      - SPRING_DATASOURCE_PASSWORD=tiger
    deploy:
      resources:
        limits:
          memory: 768M
    networks:
      - microservices-net

  # USER SERVICE
  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "7072:7072"
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      oracle-db:
        condition: service_healthy
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@//oracle-db:1521/XEPDB1
      - SPRING_DATASOURCE_USERNAME=scott
      - SPRING_DATASOURCE_PASSWORD=tiger
    deploy:
      resources:
        limits:
          memory: 768M
    networks:
      - microservices-net

  # MENTOR SERVICE
  mentor-service:
    build: ./Mentor-Service
    container_name: mentor-service
    ports:
      - "7073:7073"
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      oracle-db:
        condition: service_healthy
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@//oracle-db:1521/XEPDB1
      - SPRING_DATASOURCE_USERNAME=scott
      - SPRING_DATASOURCE_PASSWORD=tiger
    deploy:
      resources:
        limits:
          memory: 768M
    networks:
      - microservices-net

  # SKILL SERVICE
  skill-service:
    build: ./Skill-Service
    container_name: skill-service
    ports:
      - "7074:7074"
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      oracle-db:
        condition: service_healthy
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@//oracle-db:1521/XEPDB1
      - SPRING_DATASOURCE_USERNAME=scott
      - SPRING_DATASOURCE_PASSWORD=tiger
    deploy:
      resources:
        limits:
          memory: 768M
    networks:
      - microservices-net

  # REVIEW SERVICE
  review-service:
    build: ./Review-Service
    container_name: review-service
    ports:
      - "7075:7075"
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      oracle-db:
        condition: service_healthy
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@//oracle-db:1521/XEPDB1
      - SPRING_DATASOURCE_USERNAME=scott
      - SPRING_DATASOURCE_PASSWORD=tiger
    deploy:
      resources:
        limits:
          memory: 768M
    networks:
      - microservices-net

  # SESSION SERVICE
  session-service:
    build: ./Session-Service
    container_name: session-service
    ports:
      - "7076:7076"
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      oracle-db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@//oracle-db:1521/XEPDB1
      - SPRING_DATASOURCE_USERNAME=scott
      - SPRING_DATASOURCE_PASSWORD=tiger
      - SPRING_RABBITMQ_HOST=rabbitmq
    deploy:
      resources:
        limits:
          memory: 768M
    networks:
      - microservices-net

  # GROUP SERVICE
  group-service:
    build: ./group-service
    container_name: group-service
    ports:
      - "7077:7077"
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      oracle-db:
        condition: service_healthy
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@//oracle-db:1521/XEPDB1
      - SPRING_DATASOURCE_USERNAME=scott
      - SPRING_DATASOURCE_PASSWORD=tiger
    deploy:
      resources:
        limits:
          memory: 768M
    networks:
      - microservices-net

  # NOTIFICATION SERVICE
  notification-service:
    build: ./Notification-Service
    container_name: notification-service
    ports:
      - "7078:7078"
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      oracle-db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@//oracle-db:1521/XEPDB1
      - SPRING_DATASOURCE_USERNAME=scott
      - SPRING_DATASOURCE_PASSWORD=tiger
      - SPRING_RABBITMQ_HOST=rabbitmq
    deploy:
      resources:
        limits:
          memory: 768M
    networks:
      - microservices-net
  # ZIPKIN
  zipkin:
    image: openzipkin/zipkin
    container_name: zipkin
    ports:
      - "9411:9411"
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - microservices-net

  # SONARQUBE DB
  sonarqube-db:
    image: postgres:15-alpine
    container_name: sonarqube-db
    environment:
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=sonar
      - POSTGRES_DB=sonar
    volumes:
      - sonarqube-db-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - microservices-net

  # SONARQUBE
  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    depends_on:
      sonarqube-db:
        condition: service_started
    ports:
      - "9000:9000"
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://sonarqube-db:5432/sonar
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=sonar
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-logs:/opt/sonarqube/logs
      - sonarqube-extensions:/opt/sonarqube/extensions
    deploy:
      resources:
        limits:
          memory: 2048M
    networks:
      - microservices-net

volumes:
  oracle-data:
  sonarqube-db-data:
  sonarqube-data:
  sonarqube-logs:
  sonarqube-extensions:


networks:
  microservices-net:
    driver: bridge
