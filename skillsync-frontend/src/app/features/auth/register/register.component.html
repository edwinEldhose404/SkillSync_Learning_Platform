<div class="auth-container">
  <div class="glass-card">
    <div class="header">
      <h2>Create an Account</h2>
      <p>Join SkillSync and unlock your potential.</p>
    </div>

    <div class="error-banner" *ngIf="errorMessage">{{ errorMessage }}</div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" formControlName="name" placeholder="John Doe" />
        <div class="error-msg" *ngIf="registerForm.get('name')?.touched && registerForm.get('name')?.invalid">
          Name is required.
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" formControlName="email" placeholder="you@example.com" />
        <div class="error-msg" *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.invalid">
          Please enter a valid email.
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" formControlName="password" placeholder="••••••••" />
        <div class="error-msg" *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.invalid">
          Password must be at least 6 characters.
        </div>
      </div>

      <div class="form-group">
        <label for="role">Account Role (For Testing)</label>
        <select id="role" formControlName="role" style="width: 100%; padding: 12px 16px; background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; color: white;">
          <option value="USER">Standard User</option>
          <option value="ADMIN">Administrator</option>
        </select>
      </div>
      <button type="submit" [disabled]="registerForm.invalid" class="submit-btn">Sign Up</button>
    </form>

    <div class="footer">
      <p>Already have an account? <a routerLink="/login">Log in</a></p>
    </div>
  </div>
</div>
