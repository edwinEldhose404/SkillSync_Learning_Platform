<div class="auth-container">
  <div class="glass-card">
    <div class="header">
      <h2>Welcome Back</h2>
      <p>Log in to SkillSync to continue learning.</p>
    </div>

    <div class="error-banner" *ngIf="errorMessage">{{ errorMessage }}</div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" formControlName="email" placeholder="you@example.com" />
        <div class="error-msg" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid">
          Please enter a valid email.
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" formControlName="password" placeholder="••••••••" />
        <div class="error-msg" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
          Password is required.
        </div>
      </div>

      <button type="submit" [disabled]="loginForm.invalid" class="submit-btn">Sign In</button>
    </form>

    <div class="footer">
      <p>Don't have an account? <a routerLink="/register">Sign up</a></p>
    </div>
  </div>
</div>
